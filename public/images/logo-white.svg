<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" fill="none">
  <!-- ICON EMBLEM -->
  <g transform="translate(10, 5)">
    <!-- Snowflake / Cooling Half (Left - Cyan/Blue) -->
    <path d="M 28 8 L 28 52" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 28 20 L 16 12" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 28 26 L 12 24" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 28 34 L 12 36" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 28 40 L 16 48" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Snowflake Crystals Left Branch -->
    <path d="M 20 15 L 20 9" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 17 25 L 13 19" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 17 35 L 13 41" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 20 45 L 20 51" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Flame / Heating & Energy Half (Right - Vibrant Orange) -->
    <path d="M 28 8 C 36 14, 46 22, 46 32 C 46 42, 38 52, 28 52 C 34 46, 36 38, 32 30 C 30 26, 30 20, 28 8 Z" fill="url(#flameGradWhite)" />
    <path d="M 28 24 C 33 28, 38 34, 36 40 C 34 44, 30 48, 28 48 C 31 44, 31 38, 28 24 Z" fill="#FDBA74" opacity="0.9" />
  </g>

  <!-- GRADIENTS -->
  <defs>
    <linearGradient id="flameGradWhite" x1="28" y1="8" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- TYPOGRAPHY -->
  <text x="68" y="32" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="21" font-weight="800" letter-spacing="1" fill="#FFFFFF">AMBIENT</text>
  <text x="68" y="52" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="2.5" fill="#E5E7EB">ENGINEERS</text>
  <text x="70" y="62" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.2" fill="#FB923C">HVAC • MEP • INTERIORS</text>
</svg>
